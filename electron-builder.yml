appId: io.github.gingerman960.facetimelapse
productName: FaceTimelapse

files:
  - dist/renderer/**
  - electron/**
  - package.json

extraResources:
  - from: models/
    to: models/
    filter:
      - "**"

asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/canvas/**
  - node_modules/sharp/**
  - node_modules/@tensorflow/tfjs-backend-wasm/**

# electron-updater reads this `publish` block to know where to look for
# release artifacts. On `electron-builder --publish always` (used by the
# release workflow) it also pushes artifacts to GitHub Releases.
publish:
  provider: github
  owner: Gingerman960
  repo: face-timelapse

mac:
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.photography

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Graphics

win:
  target:
    - target: nsis
      arch:
        - x64

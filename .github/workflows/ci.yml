name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly: re-check dependencies against newly published advisories
  # (only the supply-chain job runs on the schedule).
  schedule:
    - cron: '23 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  NODE_VERSION: '24'
  RUST_TOOLCHAIN: '1.99.1' # must equal rust-toolchain.toml (checked in rust-fmt)

# Action versions are pinned to commit SHAs (tag in the trailing comment).
# Checkouts never persist the token, so dependency install scripts can't use it.
# Real-photo tests read FT_PHOTOS_DIR / FT_REFERENCE_PHOTO; neither exists on
# a runner, so those tests print `skipped: <reason>` and pass.

jobs:
  supply-chain:
    name: Supply chain (cargo deny, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny reads the graph through `cargo metadata`.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      # Advisories (RustSec), licences, bans and sources per deny.toml.
      - name: cargo deny check
        run: cargo deny --locked check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (runtime dependencies of ui/)
        working-directory: ui
        run: npm audit --omit=dev --audit-level=high

  rust-fmt:
    name: Rust format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain pin matches rust-toolchain.toml
        run: grep -qx "channel = \"$RUST_TOOLCHAIN\"" rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    name: Rust clippy + tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      # Keep LF endings on Windows: scripts/fetch-models.sh runs under bash.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: Install Linux system libraries (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev build-essential file
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # tauri-build checks that the bundled models exist, so every cargo
      # command that compiles src-tauri needs them.
      - name: Cache ONNX models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: onnx-models-${{ hashFiles('scripts/fetch-models.sh') }}
      - name: Fetch models (verifies SHA-256, no-op on cache hit)
        shell: bash
        run: scripts/fetch-models.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  rust-coverage:
    name: Rust coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview, clippy, rustfmt
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install Linux system libraries (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev build-essential file
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache ONNX models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: onnx-models-${{ hashFiles('scripts/fetch-models.sh') }}
      - name: Fetch models
        run: scripts/fetch-models.sh
      - name: Run tests with instrumentation
        run: cargo llvm-cov --workspace --locked --no-report
      - name: Coverage report (gate ≥ 80 % lines)
        shell: bash # -o pipefail, so `| tee` keeps the gate's exit status
        run: |
          IGNORE='(src-tauri/src/(main|lib)\.rs|/benches/|/examples/)'
          mkdir -p coverage
          cargo llvm-cov report --ignore-filename-regex "$IGNORE" --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --ignore-filename-regex "$IGNORE" --html --output-dir coverage
          cargo llvm-cov report --ignore-filename-regex "$IGNORE" --summary-only --fail-under-lines 80 | tee coverage/summary.txt
          {
            echo '### Rust line coverage'
            echo '```'
            tail -n 1 coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-coverage
          path: coverage/
          if-no-files-found: ignore

  ui:
    name: UI typecheck, lint, unit + E2E
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests with coverage (Vitest, includes the TS half of the contract drift test)
        run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-coverage
          path: ui/coverage/
          if-no-files-found: ignore
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Screenshot baselines are named `*-darwin.png`, so the pixel
      # comparisons (titles "<theme> <w>×<h> › <shot>") run in `ui-visual` on
      # macOS. Here: user flows + axe checks. The `perf` project (frame-time
      # budgets) needs a quiet machine and stays local.
      - name: E2E (flows + accessibility, mocked backend)
        run: npx playwright test --project=chromium --grep-invert '(light|dark) [0-9]+×[0-9]+'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results-linux
          path: ui/test-results/
          if-no-files-found: ignore

  ui-visual:
    name: UI visual regression (macOS baselines)
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    # Advisory: the baselines are rendered on a developer Mac; runner font
    # rasterisation can drift. Diffs are uploaded for review either way.
    continue-on-error: true
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Screenshot comparisons (3 sizes × light/dark)
        run: npx playwright test --project=chromium --grep '(light|dark) [0-9]+×[0-9]+'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-visual-diffs
          path: ui/test-results/
          if-no-files-found: ignore

  tauri-build:
    name: Tauri build smoke (macOS, debug, no bundle)
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tauri-build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Cache ONNX models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: onnx-models-${{ hashFiles('scripts/fetch-models.sh') }}
      - run: scripts/fetch-models.sh
      - run: npm --prefix ui ci
      # Runs beforeBuildCommand (`npm run build` in ui/), embeds ui/dist and
      # compiles the app binary with the production custom protocol.
      - name: tauri build --debug --no-bundle
        run: npm --prefix ui run tauri -- build --ci --debug --no-bundle
      - name: Check the binary
        run: test -x target/debug/facetimelapse && ls -lh target/debug/facetimelapse

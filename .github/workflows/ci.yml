name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4

      # No system canvas deps needed — @napi-rs/canvas ships prebuilt
      # binaries for every runner OS × arch combination we test.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Skip the Electron binary download — we're only running pure-JS
          # unit tests, not launching the desktop app.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

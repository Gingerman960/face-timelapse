name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for node-canvas
        # Even though the unit tests don't load canvas, npm install rebuilds
        # it against the runtime; missing headers here produce noisy warnings.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Skip the electron-rebuild step in CI — we're not launching Electron,
          # we're just running pure-JS unit tests.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run tests
        run: npm test

name: Release

on:
  push:
    tags:
      - 'v*'

# Lets electron-builder create a draft release + upload artifacts.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run build:mac -- --publish always
          - os: windows-latest
            build: npm run build:win -- --publish always
          - os: ubuntu-latest
            build: npx electron-builder --linux --publish always

    steps:
      - uses: actions/checkout@v4

      # No system canvas deps — @napi-rs/canvas ships prebuilt binaries.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download face-api models
        run: npm run download-models

      - name: Configure signing env (only when secrets are present)
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder treats CSC_LINK="" (empty string) as a real
          # path-to-cert and fails with `× <cwd> not a file`. Only forward
          # signing vars when the underlying secret is actually set.
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$WIN_CSC_LINK_SECRET" ]; then
            echo "WIN_CSC_LINK=$WIN_CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build + publish
        env:
          # Required for GitHub Releases publish
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't let electron-builder/app-builder go hunting for a signing
          # identity when none is configured; otherwise macOS unsigned
          # builds fail at packaging time.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.build }}

[package]
name = "face-engine"
description = "FaceTimelapse engine: photo discovery, fast decode, YuNet face detection, SFace recognition, scan cache, daily grouping, face alignment and export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# ONNX inference (YuNet + SFace). Pure Rust: no native runtime to download or bundle.
tract-onnx = "0.23.9"
# JPEG: DCT-domain downscaled decode (scan/thumbnails) + fast full decode (alignment).
jpeg-decoder = { version = "0.3.2", default-features = false }
zune-jpeg = "0.5"
# PNG/WebP/TIFF decode and PNG encode.
image = { workspace = true, features = ["png", "webp", "tiff"] }
jpeg-encoder = "0.7.1"
fast_image_resize.workspace = true
kamadak-exif = "0.6.1"
chrono = { workspace = true, features = ["clock"] }
serde.workspace = true
thiserror.workspace = true
rayon.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
# Model integrity (already in the dependency graph via tract).
sha2 = "0.10.9"
log = "0.4.34"

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "analyze"
harness = false

[[bench]]
name = "reference"
harness = false

[[bench]]
name = "backdrop"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
